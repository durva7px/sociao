services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sociao
      POSTGRES_PASSWORD: sociao
      POSTGRES_DB: sociao
    ports:
      - "5433:5432"  # 5433 on the host: a native Postgres may already own 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
